name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: france_solidaire_test
          POSTGRES_USER: france_solidaire
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U france_solidaire -d france_solidaire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://france_solidaire:test-password@localhost:5432/france_solidaire_test
      APP_URL: http://localhost:3000
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret
      EMAIL_TRANSPORT: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: RUN_DATABASE_TESTS=true npm run test:integration
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
