services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-france_solidaire}
      POSTGRES_USER: ${POSTGRES_USER:-france_solidaire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-france_solidaire} -d ${POSTGRES_DB:-france_solidaire}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-france_solidaire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-france_solidaire}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    networks: [private, web]

  email-worker:
    build: .
    restart: unless-stopped
    command: ["node", "scripts/email-worker.mjs"]
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-france_solidaire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-france_solidaire}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  maintenance:
    build: .
    restart: unless-stopped
    command: ["node", "scripts/maintenance.mjs"]
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-france_solidaire}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-france_solidaire}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Définissez DOMAIN dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
  web:
